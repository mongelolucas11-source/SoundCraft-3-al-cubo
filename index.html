<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <title>Soundcraft - Consola de sonidos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="menuButton" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="brand" href="#" aria-label="Soundcraft inicio">
          <span class="brand-mark">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect x="3" y="11" width="4" height="10" rx="2"/><rect x="10" y="7" width="4" height="18" rx="2"/><rect x="17" y="3" width="4" height="26" rx="2"/><rect x="24" y="9" width="4" height="14" rx="2"/>
            </svg>
          </span>
          <span>Soundcraft</span>
        </a>
        <button class="icon-button" id="searchButton" aria-label="Buscar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        </button>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">CONSOLE 01</p>
          <h1>Tu escenario,<br /><span>tu sonido.</span></h1>
        </div>
        <button class="profile-button" aria-label="Perfil">
          <span>LU</span>
        </button>
      </section>

      <section class="categories" aria-label="Categorías">
        <button class="category active" data-category="todos">Todos</button>
        <button class="category" data-category="ambiente">Ambiente</button>
        <button class="category" data-category="musica">Música</button>
        <button class="category" data-category="efectos">Efectos</button>
      </section>

      <section class="sound-grid" id="soundGrid" aria-live="polite"></section>

      <nav class="bottom-nav" aria-label="Navegación principal">
        <button class="nav-item active" aria-label="Inicio">
          <svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7v9h-6v-6H9v6H3z"/></svg>
          <span>Inicio</span>
        </button>
        <button class="nav-item" aria-label="Biblioteca">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg>
          <span>Biblioteca</span>
        </button>
        <button class="nav-item add-button" id="addButton" aria-label="Añadir sonido">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="nav-item" aria-label="Favoritos">
          <svg viewBox="0 0 24 24"><path d="M12 21S3 16 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 7-9 12-9 12z"/></svg>
          <span>Favoritos</span>
        </button>
        <button class="nav-item" aria-label="Ajustes">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5l-.3 3.1a8 8 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.3 3.1h5l.3-3.1a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>
          <span>Ajustes</span>
        </button>
      </nav>
    </main>

    <dialog id="soundDialog">
      <form method="dialog">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">NUEVO SONIDO</p>
            <h2>Añadir a la consola</h2>
          </div>
          <button class="dialog-close" value="cancel" aria-label="Cerrar">×</button>
        </div>
        <label>Nombre
          <input id="soundName" type="text" placeholder="Ej. Lluvia nocturna" maxlength="24" />
        </label>
        <label>Categoría
          <select id="soundCategory">
            <option value="ambiente">Ambiente</option>
            <option value="musica">Música</option>
            <option value="efectos">Efectos</option>
          </select>
        </label>
        <button class="primary-button" id="saveSound" value="default">Añadir sonido</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
